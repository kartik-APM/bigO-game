[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: section paths such as /leaderboard serve index.html,
# and the app scrolls to that section. Real files (assets) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
