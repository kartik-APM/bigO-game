name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compile every snippet (C++, Java, Python, JavaScript)
        run: npm run check:snippets
      - name: Answer key SQL is in sync with snippets
        run: npm run db:answers:check
      - run: npm run build
